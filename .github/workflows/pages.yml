name: GitHub Pages

# Публикует приложение на https://xsitraxs.github.io/dota-2/
# Приложение чисто статическое: index.html + assets/ + data/ (сборщик фронта не нужен).
#
# Воркфлоу подстраивается под настройку Settings → Pages → Source:
#   • «GitHub Actions»  — прогоняет проверки, собирает чистый артефакт
#                         (только index.html + assets/ + data/) и деплоит его;
#   • «Deploy from a branch» — GitHub сам публикует ветку main, воркфлоу
#                         ограничивается проверками и не лезет в деплой.
on:
  push:
    branches: [main]
  # Проверки нужны и на pull request: деплой всё равно остаётся только для main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; прерывать текущий не надо — иначе можно получить битый сайт.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages_mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # dev-зависимости: eslint (линтер) и jsdom (прогон интерфейса).
      - name: Install dev dependencies
        run: npm ci

      # Гейт стиля: базовые правила ESLint (no-unused-vars, eqeqeq, recommended).
      - name: Lint
        run: npm run lint

      # Гейт: движок разбора должен работать на тех данных, которые уедут в прод.
      - name: Test engine on shipped data
        run: node tools/test_engine.mjs

      # Гейт распознавания: синтетические «скриншоты» собираются ImageMagick из тех же иконок.
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Test screenshot recognition
        run: npm run test:recognize

      # Гейт интерфейса: jsdom-прогон против тех же файлов (сервер поднимается на время шага).
      - name: Test UI on shipped data
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          node tools/test_ui.mjs

      - name: Detect Pages source
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo none)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Settings → Pages → Source: $mode"

      - name: Stage site
        if: steps.pages_mode.outputs.mode == 'workflow'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data _site/
          echo "files: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Configure Pages
        if: steps.pages_mode.outputs.mode == 'workflow'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        if: steps.pages_mode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Note
        if: steps.pages_mode.outputs.mode != 'workflow'
        run: |
          echo "Pages публикуется из ветки (Source: Deploy from a branch) — GitHub соберёт сайт сам."
          echo "Проверки движка и интерфейса пройдены, деплой через Actions не требуется."
          echo "Чтобы деплоить чистый артефакт (без tools/ и README), поставьте Source: GitHub Actions."

  deploy:
    needs: build
    # Деплой только с main: на pull request выполняются одни проверки.
    if: needs.build.outputs.pages_mode == 'workflow' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
