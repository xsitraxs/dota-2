name: GitHub Pages

# Публикует приложение на https://xsitraxs.github.io/dota-2/
# Приложение чисто статическое: index.html + assets/ + data/ (сборщик фронта не нужен).
#
# Воркфлоу подстраивается под настройку Settings → Pages → Source:
#   • «GitHub Actions»  — прогоняет проверки, собирает чистый артефакт
#                         (только index.html + assets/ + data/) и деплоит его;
#   • «Deploy from a branch» — GitHub сам публикует ветку main, воркфлоу
#                         ограничивается проверками и не лезет в деплой.
# Политику (права, условия публикации, закрепление действий по SHA) проверяет tools/test_ci.mjs.
# Версии действий — на Node 24 (checkout v7, setup-node v7, configure-pages v6, deploy-pages v5,
# upload-pages-artifact v5): прошлые мажоры (checkout/setup-node v4 и ниже, configure-pages v5,
# deploy-pages v4, upload-pages-artifact v3) ещё работают на Node 20 и дают на каждом прогоне
# предупреждение о его скором отключении.
on:
  push:
    branches: [main]
  # Проверки нужны и на pull request: деплой всё равно остаётся только для main.
  pull_request:
  workflow_dispatch:

# По умолчанию у токена нет никаких прав: каждый job ниже получает только то, что ему нужно.
permissions: {}

# Прогоны одной ветки или одного PR не копятся: новый коммит в PR отменяет устаревшую проверку,
# а прогоны main идут по очереди (текущий не прерывается). Группа зависит от ветки/PR, поэтому
# проверка из PR больше не может вытеснить ожидающую публикацию main (раньше у всех прогонов
# была одна группа «pages», и новый прогон отменял ожидающий).
concurrency:
  group: pages-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Сборка и тесты выполняют код репозитория и dev-зависимостей — им только чтение:
    # contents — checkout, pages — узнать режим публикации (GET /repos/{repo}/pages).
    permissions:
      contents: read
      pages: read
    outputs:
      pages_mode: ${{ steps.pages_mode.outputs.mode }}
      deploy: ${{ steps.pages_mode.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен не сохраняется в .git/config: тестам и зависимостям он не нужен.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # dev-зависимости: eslint (линтер), jsdom (прогон интерфейса), yaml (проверка этого файла).
      # Скрипты установки пакетов не запускаем: ни одному из них они не нужны, а для цепочки
      # поставок это лишняя точка исполнения чужого кода.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      # Гейт стиля: базовые правила ESLint (no-unused-vars, eqeqeq, recommended).
      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # Гейт: движок, данные и база знаний, политика этого workflow — на том, что уедет в прод.
      - name: Test engine, data and CI policy
        run: npm test

      # Гейт распознавания: синтетические «скриншоты» собираются ImageMagick из тех же иконок,
      # а tools/test_recognize_fixtures.mjs гоняет те же шаблоны на реальных кадрах драфта (tools/rec_fixtures).
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Test screenshot recognition
        run: npm run test:recognize

      # Гейт интерфейса: jsdom-прогон против тех же файлов (сервер поднимается на время шага).
      - name: Test UI on shipped data
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 0.25; done
          npm run test:ui

      # Гейт настоящего браузера: Chromium из npm-пакета (@sparticuz/chromium, без сети)
      # прогоняет пользовательские сценарии — загрузку и вставку скриншота, выбор героев,
      # ссылку-шаринг, чеклист после перезагрузки и узкий экран.
      - name: Test app in real browser
        run: npm run test:browser

      # Режим публикации и решение «публиковать ли». Ошибка API на push/dispatch — явный сбой,
      # а не молчаливое «Pages выключен»: иначе сайт тихо перестал бы обновляться.
      - name: Detect Pages source
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err="${RUNNER_TEMP:-/tmp}/pages-api-error.txt"
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>"$err"); then
            mode="$out"
          elif grep -q 'HTTP 404' "$err"; then
            mode=none
          else
            cat "$err" >&2
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Не удалось прочитать настройки Pages; на pull request публикации всё равно нет"
              mode=unknown
            else
              echo "::error::Не удалось прочитать настройки Pages (нужно право pages: read) — публикация не выполнена, перезапустите workflow"
              exit 1
            fi
          fi
          deploy=false
          if [ "$mode" = "workflow" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            deploy=true
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Settings → Pages → Source: $mode; публикация в этом прогоне: $deploy"

      - name: Stage site
        if: steps.pages_mode.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp sitemap.xml robots.txt site.webmanifest _site/ 2>/dev/null || true
          cp -r assets data _site/
          echo "files: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Configure Pages
        if: steps.pages_mode.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.pages_mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Note
        if: steps.pages_mode.outputs.deploy != 'true'
        env:
          MODE: ${{ steps.pages_mode.outputs.mode }}
        run: |
          case "$MODE" in
            legacy) echo "Pages публикуется из ветки (Source: Deploy from a branch) — GitHub соберёт сайт сам. Проверки пройдены." ;;
            workflow) echo "Source: GitHub Actions, но это не push/запуск в main — выполнены только проверки, без публикации." ;;
            none) echo "GitHub Pages в репозитории не включён — выполнены только проверки." ;;
            *) echo "Режим публикации не определён ($MODE) — выполнены только проверки." ;;
          esac
          echo "Чтобы деплоить чистый артефакт (без tools/ и README), поставьте Source: GitHub Actions."

  deploy:
    needs: build
    # Публикация — только с main и никогда из pull request. Решение вычисляет build, но условия
    # продублированы здесь: job не запустится, даже если вывод build окажется неожиданным.
    if: needs.build.outputs.deploy == 'true' && needs.build.outputs.pages_mode == 'workflow' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Права на запись — только здесь: этот job не выполняет код репозитория, а лишь публикует
    # проверенный артефакт (pages: write — деплой, id-token: write — подтверждение источника).
    permissions:
      pages: write
      id-token: write
    # Один деплой за раз; текущий не прерываем — иначе можно получить битый сайт.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
